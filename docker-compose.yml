services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: audio_guide
      POSTGRES_USER: guide
      POSTGRES_PASSWORD: guide
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guide -d audio_guide"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
